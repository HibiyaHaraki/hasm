name: GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Tauri cannot cross-compile installers; each platform builds on its own runner.
    #   Windows -> .msi (WiX, license dialog) + .exe (NSIS, license page)
    #   macOS   -> .dmg
    #   Linux   -> .AppImage + .deb
    name: Build and Publish ${{ matrix.platform-name }} Release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform-name: Windows
          - os: macos-latest
            platform-name: macOS
          - os: ubuntu-22.04
            platform-name: Linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          lfs: true

      - name: Sync submodules
        run: git submodule sync --recursive

      - name: Update submodules
        run: git submodule update --init --recursive

      - name: Pull Git LFS objects for repository and submodules
        shell: pwsh
        run: |
          git lfs install --local
          git lfs pull
          git submodule foreach --recursive 'git lfs install --local; git lfs pull'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: npm install

      - name: Build Tauri bundles
        run: npm run tauri:build

      - name: Publish Windows installers
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish macOS installer
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg

      - name: Publish Linux installers
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Linux'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb