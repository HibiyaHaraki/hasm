name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          lfs: true

      - name: Sync submodules
        run: git submodule sync --recursive

      - name: Update submodules
        run: git submodule update --init --recursive

      - name: Pull Git LFS objects for repository and submodules
        shell: pwsh
        run: |
          git lfs install --local
          git lfs pull
          git submodule foreach --recursive 'git lfs install --local; git lfs pull'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: EVAL-01 React tests
        run: npm run test:seq-md-01

      - name: EVAL-02 React tests
        run: npm run test:seq-md-02

      - name: Build frontend
        run: npm run build

  rust:
    name: Rust Check (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          lfs: true

      - name: Sync submodules
        run: git submodule sync --recursive

      - name: Update submodules
        run: git submodule update --init --recursive

      - name: Pull Git LFS objects for repository and submodules
        shell: pwsh
        run: |
          git lfs install --local
          git lfs pull
          git submodule foreach --recursive 'git lfs install --local; git lfs pull'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check

      - name: EVAL-01 Rust command tests
        working-directory: src-tauri
        run: cargo test app_commands

      - name: EVAL-02 Rust model loading tests
        working-directory: src-tauri
        run: cargo test model_commands